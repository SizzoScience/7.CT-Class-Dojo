<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Science Monster Dojo</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-purple: #a855f7;
      --accent-teal: #14b8a6;
      --accent-cyan: #06b6d4;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; }

    /* Header & Navigation */
    header { background: #1e1b4b; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent-purple); }
    .logo { display: flex; align-items: center; gap: 0.75rem; font-size: 1.5rem; font-weight: bold; color: var(--accent-teal); }
    nav { display: flex; gap: 0.5rem; }
    nav button { background: transparent; border: 1px solid var(--accent-purple); color: var(--text-light); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    nav button.active, nav button:hover { background: var(--accent-purple); color: white; }
    
    .controls-top { display: flex; gap: 1rem; align-items: center; }
    .icon-btn { background: var(--card-bg); border: 1px solid #334155; color: var(--text-light); padding: 0.5rem 0.75rem; border-radius: 6px; cursor: pointer; }

    /* Main Container */
    main { flex: 1; padding: 1.5rem; max-width: 1400px; margin: 0 auto; width: 100%; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Goal Bar */
    .goal-container { background: var(--card-bg); padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem; }
    .progress-bar { flex: 1; height: 20px; background: #334155; border-radius: 10px; overflow: hidden; position: relative; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent-teal), var(--accent-purple)); width: 0%; transition: width 0.3s ease; }
    
    /* Grid View */
    .dojo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; }
    .student-card { background: var(--card-bg); border-radius: 16px; padding: 1rem; text-align: center; border: 1px solid #334155; position: relative; transition: transform 0.2s, border-color 0.2s; }
    .student-card:hover { transform: translateY(-4px); border-color: var(--accent-teal); }
    
    .score-badge { position: absolute; top: 10px; right: 10px; background: var(--accent-purple); color: white; font-weight: bold; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
    .avatar-wrapper { height: 120px; display: flex; align-items: center; justify-content: center; margin: 0.5rem 0; cursor: pointer; }
    
    /* Monster SVG Styles & Animations */
    .monster-svg { width: 100px; height: 100px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
    .monster-eye { animation: blink 4s infinite; transform-origin: center; }
    @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    
    .card-actions { display: flex; justify-content: center; gap: 0.5rem; margin-top: 0.5rem; }
    .btn-add { background: var(--success); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* Seating Layout */
    .lab-tables { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem; }
    .lab-table { background: #0284c715; border: 2px dashed #0284c7; border-radius: 16px; padding: 1rem; }
    .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }

    /* Modal Framework */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .modal-body { background: var(--card-bg); padding: 2rem; border-radius: 16px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; position: relative; }
    .close-btn { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }

    /* Customizer Controls */
    .swatches { display: flex; gap: 0.5rem; margin: 0.5rem 0 1rem; }
    .swatch { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid white; }

    /* Printable CSS */
    @media print {
      body { background: white; color: black; }
      header, nav, .goal-container, .card-actions, .controls-top, .modal { display: none !important; }
      .print-area { display: block !important; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🔬 Science Monster Dojo</div>
    <nav>
      <button class="active" onclick="switchTab('grid')">Classroom</button>
      <button onclick="switchTab('seating')">Lab Tables</button>
      <button onclick="switchTab('toolkit')">Toolkit</button>
      <button onclick="switchTab('reports')">Report Cards</button>
    </nav>
    <div class="controls-top">
      <button class="icon-btn" id="soundToggle" onclick="toggleSound()">🔊 Sound On</button>
    </div>
  </header>

  <main>
    <!-- Collective Class Goal -->
    <div class="goal-container">
      <strong>Class Goal:</strong>
      <div class="progress-bar">
        <div class="progress-fill" id="goalProgress"></div>
      </div>
      <span id="goalText">0 / 100 Points</span>
    </div>

    <!-- TAB 1: Grid View -->
    <div id="grid-tab" class="tab-content active">
      <div class="dojo-grid" id="studentGrid"></div>
    </div>

    <!-- TAB 2: Seating View -->
    <div id="seating-tab" class="tab-content">
      <div class="lab-tables" id="tablesContainer"></div>
    </div>

    <!-- TAB 3: Toolkit -->
    <div id="toolkit-tab" class="tab-content">
      <div style="display: flex; gap: 2rem; flex-wrap: wrap;">
        <div style="background: var(--card-bg); padding: 1.5rem; border-radius: 12px; flex: 1; min-width: 280px;">
          <h3>🎲 Random Student Picker</h3>
          <h2 id="selectedStudent" style="color: var(--accent-cyan); margin: 1rem 0;">-</h2>
          <button class="icon-btn" onclick="pickRandomStudent()">Pick Student</button>
        </div>
        <div style="background: var(--card-bg); padding: 1.5rem; border-radius: 12px; flex: 1; min-width: 280px;">
          <h3>⏱️ Lab Timer</h3>
          <h2 id="timerDisplay" style="margin: 1rem 0;">02:00</h2>
          <button class="icon-btn" onclick="toggleTimer()">Start / Pause</button>
          <button class="icon-btn" onclick="resetTimer()">Reset</button>
        </div>
      </div>
    </div>

    <!-- TAB 4: Report Cards -->
    <div id="reports-tab" class="tab-content">
      <h3>Printable Student Progress Reports</h3>
      <div id="reportList" style="margin-top: 1rem;"></div>
    </div>
  </main>

  <!-- Modal: Award Skill -->
  <div class="modal" id="skillModal">
    <div class="modal-body">
      <button class="close-btn" onclick="closeModal('skillModal')">&times;</button>
      <h3 id="skillModalTitle">Award Points</h3>
      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-top: 1rem;">
        <button class="icon-btn" onclick="awardPoints(1, 'Lab Safety')">🛡️ Lab Safety (+1)</button>
        <button class="icon-btn" onclick="awardPoints(1, 'Great Hypothesis')">💡 Great Hypothesis (+1)</button>
        <button class="icon-btn" onclick="awardPoints(1, 'Data Integrity')">📊 Data Integrity (+1)</button>
        <button class="icon-btn" onclick="awardPoints(1, 'Peer Collaboration')">🤝 Teamwork (+1)</button>
      </div>
    </div>
  </div>

  <!-- Modal: Customizer -->
  <div class="modal" id="customizerModal">
    <div class="modal-body">
      <button class="close-btn" onclick="closeModal('customizerModal')">&times;</button>
      <h3>🔬 Monster Lab Customizer</h3>
      <div id="customizerPreview" style="text-align: center; margin: 1rem 0;"></div>
      <label>Body Color:</label>
      <div class="swatches">
        <div class="swatch" style="background:#a855f7" onclick="setMonsterColor('#a855f7')"></div>
        <div class="swatch" style="background:#14b8a6" onclick="setMonsterColor('#14b8a6')"></div>
        <div class="swatch" style="background:#f59e0b" onclick="setMonsterColor('#f59e0b')"></div>
        <div class="swatch" style="background:#ef4444" onclick="setMonsterColor('#ef4444')"></div>
      </div>
    </div>
  </div>

  <script>
    // --- APP STATE WITH LOCALSTORAGE ---
    const defaultStudents = [
      { id: 1, name: 'Cleo', points: 0, color: '#a855f7', eyes: 1, table: 'Chemistry' },
      { id: 2, name: 'Chloe', points: 0, color: '#14b8a6', eyes: 2, table: 'Chemistry' },
      { id: 3, name: 'Sophia', points: 0, color: '#f59e0b', eyes: 2, table: 'Chemistry' },
      { id: 4, name: 'Maeve', points: 0, color: '#ef4444', eyes: 3, table: 'Physics' },
      { id: 5, name: 'Franki', points: 0, color: '#3b82f6', eyes: 1, table: 'Physics' },
      { id: 6, name: 'Sami', points: 0, color: '#10b981', eyes: 2, table: 'Physics' },
      { id: 7, name: 'Charlotte', points: 0, color: '#ec4899', eyes: 2, table: 'Biology' },
      { id: 8, name: 'Zoe', points: 0, color: '#8b5cf6', eyes: 1, table: 'Biology' },
      { id: 9, name: 'Molly', points: 0, color: '#06b6d4', eyes: 3, table: 'Biology' },
      { id: 10, name: 'Scout', points: 0, color: '#f97316', eyes: 2, table: 'Biology' },
      { id: 11, name: 'Marlowe', points: 0, color: '#84cc16', eyes: 1, table: 'Chemistry' },
      { id: 12, name: 'Tilly', points: 0, color: '#6366f1', eyes: 2, table: 'Physics' }
    ];

    let students = JSON.parse(localStorage.getItem('dojo_students')) || defaultStudents;
    let selectedStudentId = null;
    let soundMuted = false;

    function saveState() {
      localStorage.setItem('dojo_students', JSON.stringify(students));
    }

    // --- SYNTHESIZED SOUND SYSTEM ---
    function playSound(freq = 440, type = 'sine') {
      if (soundMuted) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.3);
        setTimeout(() => ctx.close(), 300);
      } catch(e){}
    }

    function toggleSound() {
      soundMuted = !soundMuted;
      document.getElementById('soundToggle').innerText = soundMuted ? '🔇 Sound Off' : '🔊 Sound On';
    }

    // --- SVG MONSTER RENDERER ---
    function createMonsterSVG(color, eyes) {
      let eyeMarkup = '';
      if (eyes === 1) {
        eyeMarkup = `<circle cx="50" cy="45" r="12" fill="white"/><circle class="monster-eye" cx="50" cy="45" r="5" fill="#0f172a"/>`;
      } else if (eyes === 2) {
        eyeMarkup = `<circle cx="38" cy="45" r="10" fill="white"/><circle class="monster-eye" cx="38" cy="45" r="4" fill="#0f172a"/>
                     <circle cx="62" cy="45" r="10" fill="white"/><circle class="monster-eye" cx="62" cy="45" r="4" fill="#0f172a"/>`;
      } else {
        eyeMarkup = `<circle cx="30" cy="45" r="8" fill="white"/><circle class="monster-eye" cx="30" cy="45" r="3" fill="#0f172a"/>
                     <circle cx="50" cy="38" r="8" fill="white"/><circle class="monster-eye" cx="50" cy="38" r="3" fill="#0f172a"/>
                     <circle cx="70" cy="45" r="8" fill="white"/><circle class="monster-eye" cx="70" cy="45" r="3" fill="#0f172a"/>`;
      }

      return `<svg class="monster-svg" viewBox="0 0 100 100">
        <path d="M20 80 C20 30, 80 30, 80 80 C80 90, 20 90, 20 80 Z" fill="${color}" />
        ${eyeMarkup}
        <path d="M 40 68 Q 50 78 60 68" stroke="#0f172a" stroke-width="3" fill="none" />
      </svg>`;
    }

    // --- RENDER FUNCTIONS ---
    function renderGrid() {
      const grid = document.getElementById('studentGrid');
      grid.innerHTML = '';
      let totalPoints = 0;

      students.forEach(s => {
        totalPoints += s.points;
        const card = document.createElement('div');
        card.className = 'student-card';
        card.innerHTML = `
          <div class="score-badge">${s.points}</div>
          <div class="avatar-wrapper" onclick="openCustomizer(${s.id})">${createMonsterSVG(s.color, s.eyes)}</div>
          <h3>${s.name}</h3>
          <div class="card-actions">
            <button class="btn-add" onclick="openSkillModal(${s.id})">+</button>
          </div>
        `;
        grid.appendChild(card);
      });

      // Update Class Goal Progress
      const goalFill = document.getElementById('goalProgress');
      const goalText = document.getElementById('goalText');
      const percentage = Math.min(100, (totalPoints / 100) * 100);
      goalFill.style.width = percentage + '%';
      goalText.innerText = `${totalPoints} / 100 Points`;
    }

    function renderTables() {
      const container = document.getElementById('tablesContainer');
      container.innerHTML = '';
      const tables = ['Chemistry', 'Physics', 'Biology'];

      tables.forEach(table => {
        const div = document.createElement('div');
        div.className = 'lab-table';
        const tableStudents = students.filter(s => s.table === table);
        
        div.innerHTML = `
          <div class="table-header">
            <h4>${table} Table</h4>
            <button class="icon-btn" onclick="awardTable('${table}')">+1 All</button>
          </div>
          <div style="display:flex; gap:1rem; flex-wrap:wrap;">
            ${tableStudents.map(s => `<div>${createMonsterSVG(s.color, s.eyes)}<p style="text-align:center">${s.name} (${s.points})</p></div>`).join('')}
          </div>
        `;
        container.appendChild(div);
      });
    }

    function renderReports() {
      const container = document.getElementById('reportList');
      container.innerHTML = students.map(s => `
        <div style="background:var(--card-bg); padding:1rem; border-radius:8px; margin-bottom:0.5rem; display:flex; justify-content:space-between; align-items:center;">
          <div><strong>${s.name}</strong> - Total Points: ${s.points}/20</div>
          <button class="icon-btn" onclick="window.print()">🖨️ Print Report</button>
        </div>
      `).join('');
    }

    // --- INTERACTION LOGIC ---
    function openSkillModal(id) {
      selectedStudentId = id;
      document.getElementById('skillModal').classList.add('active');
    }

    function awardPoints(val, skill) {
      const student = students.find(s => s.id === selectedStudentId);
      if (student) {
        student.points += val;
        playSound(523.25); // High C sound
        
        // 20-Point Auto-Reset Rule
        if (student.points >= 20) {
          student.points = 0;
          alert(`🎉 ${student.name} hit 20 points! Milestone achieved! Score reset to 0.`);
          playSound(880);
        }
        
        saveState();
        renderGrid();
        renderTables();
        closeModal('skillModal');
      }
    }

    function awardTable(tableName) {
      students.filter(s => s.table === tableName).forEach(s => {
        s.points += 1;
        if (s.points >= 20) s.points = 0;
      });
      playSound(587.33);
      saveState();
      renderGrid();
      renderTables();
    }

    function openCustomizer(id) {
      selectedStudentId = id;
      const student = students.find(s => s.id === id);
      document.getElementById('customizerPreview').innerHTML = createMonsterSVG(student.color, student.eyes);
      document.getElementById('customizerModal').classList.add('active');
    }

    function setMonsterColor(color) {
      const student = students.find(s => s.id === selectedStudentId);
      if (student) {
        student.color = color;
        document.getElementById('customizerPreview').innerHTML = createMonsterSVG(student.color, student.eyes);
        saveState();
        renderGrid();
        renderTables();
      }
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function switchTab(tab) {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(`${tab}-tab`).classList.add('active');
      if (tab === 'reports') renderReports();
    }

    // --- TOOLKIT LOGIC ---
    function pickRandomStudent() {
      const rand = students[Math.floor(Math.random() * students.length)];
      document.getElementById('selectedStudent').innerText = `${rand.name}!`;
      playSound(659.25);
    }

    let timerInterval = null;
    let timerSeconds = 120;

    function toggleTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      } else {
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
            const s = String(timerSeconds % 60).padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${m}:${s}`;
          } else {
            clearInterval(timerInterval);
            playSound(330);
            alert("⏰ Lab time is up!");
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      timerSeconds = 120;
      document.getElementById('timerDisplay').innerText = "02:00";
    }

    // Initial Initialization
    renderGrid();
    renderTables();
  </script>
</body>
</html>
